<!doctype html>
<html lang="en" data-theme="hearthlight" data-mode="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#050a12">
  <meta name="color-scheme" content="dark">
  <title>Hearthlight · home network</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='7' fill='%235ee7ff'/%3E%3Ccircle cx='16' cy='16' r='12' fill='none' stroke='%235ee7ff' stroke-opacity='.4'/%3E%3C/svg%3E">
  <script src="/themes.js"></script>
  <script src="/theme-boot.js"></script>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <canvas id="map" aria-label="Interactive map of your home network"></canvas>
  <div class="vignette" aria-hidden="true"></div>

  <header class="topbar">
    <div class="brand glass">
      <span class="brand-orb" aria-hidden="true"></span>
      <div class="brand-text">
        <h1>Hearthlight</h1>
        <p id="subtitle">connecting to the network inventory</p>
      </div>
    </div>

    <div id="stats" class="stats glass" aria-live="polite"></div>

    <div class="actions glass">
      <span id="conn" class="conn" title="Live connection state"><i aria-hidden="true"></i><span>connecting</span></span>
      <span class="divider" aria-hidden="true"></span>
      <button id="historyBtn" class="icon-text" type="button" aria-pressed="true" title="Show devices and services from past scans">
        <span class="history-dot" aria-hidden="true"></span><span>history</span>
      </button>
      <button id="tailnetBtn" class="icon-text tailnet-btn" type="button" aria-pressed="true" title="Hide tailnet hosts and overlays" hidden>
        <svg class="knot" viewBox="-4 -4 8 8" fill="none" stroke="currentColor" stroke-width=".95" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M -2.7 2.2 L 0 -2.9 L 2.7 2.2 Z"/>
          <circle cx="-2.7" cy="2.2" r=".85" fill="currentColor" stroke="none"/>
          <circle cx="0" cy="-2.9" r=".85" fill="currentColor" stroke="none"/>
          <circle cx="2.7" cy="2.2" r=".85" fill="currentColor" stroke="none"/>
        </svg><span>tailnet</span>
      </button>
      <span class="divider" aria-hidden="true"></span>
      <button id="scanBtn" class="scan-btn" type="button">
        <span class="scan-icon" aria-hidden="true"></span><span>Scan</span>
      </button>
      <span class="divider" aria-hidden="true"></span>
      <div class="zoom-group">
        <button id="zoomOut" class="icon-btn" type="button" aria-label="Zoom out">−</button>
        <button id="fitBtn" class="icon-btn" type="button" aria-label="Fit network on screen">fit</button>
        <button id="zoomIn" class="icon-btn" type="button" aria-label="Zoom in">+</button>
      </div>
    </div>
  </header>

  <section id="deviceList" class="device-list" aria-labelledby="deviceListHeading">
    <h2 id="deviceListHeading">Devices</h2>
    <p id="deviceSummary" class="visually-hidden" role="status" aria-live="polite" aria-atomic="true"></p>
    <ul id="deviceListItems"></ul>
  </section>

  <aside id="panel" class="panel" aria-label="Device details" aria-hidden="true" inert></aside>

  <div id="empty" class="empty" aria-live="polite">
    <div class="empty-orb" aria-hidden="true"></div>
    <h2>Sweeping the network</h2>
    <p>Hearthlight is resolving neighbours and probing common services.</p>
  </div>

  <div id="legend" class="legend glass" aria-label="Map legend"></div>
  <div class="hint">drag to pan · scroll to zoom · click a bubble</div>
  <div id="tooltip" class="tooltip" role="status"></div>
  <div id="toast" class="toast" role="status"></div>

  <noscript>
    <div class="noscript">Hearthlight needs JavaScript to draw the network map.</div>
  </noscript>

  <script src="/app.js" defer></script>
</body>
</html>
